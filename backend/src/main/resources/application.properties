spring.application.name=HiringChallengeApi

# Local profile: use the PostgreSQL service exposed by docker-compose on localhost.
spring.datasource.url=jdbc:postgresql://localhost:5432/hiring
spring.datasource.username=hiring
spring.datasource.password=hiring
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
