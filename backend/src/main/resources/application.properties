spring.application.name=HiringChallengeApi
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

---
spring.config.activate.on-profile=local
# Local profile: use the PostgreSQL service exposed by docker-compose on localhost.
spring.datasource.url=jdbc:postgresql://localhost:5432/hiring
spring.datasource.username=hiring
spring.datasource.password=hiring
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

---
spring.config.activate.on-profile=docker
# docker-compose의 Postgres 서비스(`db`)에 연결합니다.
spring.datasource.url=jdbc:postgresql://db:5432/hiring
spring.datasource.username=hiring
spring.datasource.password=hiring
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
