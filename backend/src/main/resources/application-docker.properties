# docker-compose의 Postgres 서비스(`db`)에 연결합니다.
# 로컬 기본 profile은 localhost:5432의 Postgres에 연결하고, docker profile은 컨테이너 네트워크의 db:5432에 연결합니다.
spring.datasource.url=jdbc:postgresql://db:5432/hiring
spring.datasource.username=hiring
spring.datasource.password=hiring
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
