# docker-compose의 Postgres 서비스(`db`)에 연결합니다.
# 로컬에서 ./gradlew bootRun 할 때는 기본 application.properties만 적용되므로 DB가 없어도 됩니다.
spring.datasource.url=jdbc:postgresql://db:5432/hiring
spring.datasource.username=hiring
spring.datasource.password=hiring
spring.datasource.driver-class-name=org.postgresql.Driver

# 과제에서 스키마를 코드/마이그레이션으로 관리하기 전까지는 연결 검증만 하면 됩니다.
# JPA를 붙이면 ddl-auto 등으로 조정하세요.
